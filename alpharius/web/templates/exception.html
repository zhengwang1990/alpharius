<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='img/logo-32x32.png') }}"
        sizes="32x32">

  <link rel="apple-touch-icon"
        type="image/png"
        href="{{ url_for('static', filename='img/logo-180x180.png') }}"
        sizes="180x180">

  <title>Alpharius</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #eef6ff;
      --card: #ffffff;
      --card-border: rgba(2, 132, 199, 0.16);

      --text: #0f2a44;
      --muted: #55738f;

      --accent: #0284c7;
      --accent-soft: #38bdf8;

      --error: #e11d48;

      --terminal: #f4faff;
      --terminal-text: #33506b;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 20px;

      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(56, 189, 248, 0.28),
          transparent 38%
        ),
        radial-gradient(
          circle at 50% 70%,
          rgba(14, 165, 233, 0.12),
          transparent 45%
        ),
        linear-gradient(
          145deg,
          #f7fbff 0%,
          #eaf4ff 45%,
          #dceeff 100%
        );

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 720px;

      text-align: center;
    }

    /*
     * Browser illustration
     */
    .browser {
      width: 360px;
      height: 235px;

      margin: 0 auto 42px;

      position: relative;

      background: var(--card);

      border: 1px solid rgba(2, 132, 199, 0.18);
      border-radius: 12px;

      box-shadow:
        0 24px 60px rgba(12, 74, 110, 0.16),
        0 0 60px rgba(56, 189, 248, 0.18),
        0 0 20px rgba(14, 165, 233, 0.08);

      overflow: hidden;

      animation: float 4s ease-in-out infinite;
    }

    /*
     * Browser controls
     */
    .controls {
      height: 34px;

      display: flex;
      align-items: center;

      gap: 7px;

      padding: 0 12px;

      background: #e2f1fd;

      border-bottom: 1px solid #cbe4f8;
    }

    .controls i {
      width: 10px;
      height: 10px;

      display: block;

      border-radius: 50%;

      background: #bcd7ea;
    }

    .controls i:first-child {
      background: #fb7185;
    }

    .controls i:nth-child(2) {
      background: #fbbf24;
    }

    .controls i:nth-child(3) {
      background: #34d399;
    }

    /*
     * Sad face
     */
    .face {
      position: absolute;
      inset: 34px 0 0;
    }

    .eye {
      position: absolute;

      top: 58px;

      width: 30px;
      height: 30px;
    }

    .eye:first-child {
      left: 30%;
    }

    .eye:nth-child(2) {
      right: 30%;
    }

    .eye::before,
    .eye::after {
      content: "";

      position: absolute;

      left: 13px;
      top: -4px;

      width: 3px;
      height: 38px;

      border-radius: 3px;

      background: var(--error);
    }

    .eye::before {
      transform: rotate(45deg);
    }

    .eye::after {
      transform: rotate(-45deg);
    }

    /*
     * Mouth
     */
    .mouth {
      position: absolute;

      left: 50%;
      top: 137px;

      width: 210px;
      height: 35px;

      transform: translateX(-50%);
    }

    .lips {
      position: absolute;

      top: 0;

      width: 3px;
      height: 35px;

      border-radius: 3px;

      background: var(--error);
    }

    .lips:nth-child(1) {
      left: 0;
      transform: rotate(-54deg);
    }

    .lips:nth-child(2) {
      left: 30px;
      transform: rotate(54deg);
    }

    .lips:nth-child(3) {
      left: 60px;
      transform: rotate(-54deg);
    }

    .lips:nth-child(4) {
      left: 90px;
      transform: rotate(54deg);
    }

    .lips:nth-child(5) {
      left: 120px;
      transform: rotate(-54deg);
    }

    .lips:nth-child(6) {
      left: 150px;
      transform: rotate(54deg);
    }

    .lips:nth-child(7) {
      left: 180px;
      transform: rotate(-54deg);
    }

    .lips:nth-child(8) {
      left: 210px;
      transform: rotate(54deg);
    }

    /*
     * Main message
     */
    h1 {
      margin: 0 0 10px;

      font-size: clamp(26px, 5vw, 34px);
      line-height: 1.25;

      font-weight: 650;

      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 0 auto 26px;

      max-width: 600px;

      color: var(--muted);

      font-size: 16px;
      line-height: 1.6;
    }

    /*
     * Error / traceback panel
     */
    .error-card {
      width: 100%;

      text-align: left;

      background: var(--terminal);

      border: 1px solid var(--card-border);

      border-radius: 10px;

      overflow: hidden;

      box-shadow:
        0 16px 40px rgba(12, 74, 110, 0.10),
        0 0 30px rgba(56, 189, 248, 0.08);
    }

    .error-header {
      height: 38px;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 0 14px;

      background: rgba(56, 189, 248, 0.12);

      border-bottom: 1px solid rgba(2, 132, 199, 0.12);

      color: #4a6b88;

      font-size: 12px;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
    }

    .error-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--error);

      box-shadow: 0 0 8px rgba(225, 29, 72, 0.30);
    }

    .traceback {
      margin: 0;

      padding: 18px;

      color: var(--terminal-text);

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        "Courier New",
        monospace;

      font-size: 13px;
      line-height: 1.6;

      white-space: pre-wrap;
      overflow-x: auto;
    }

    .error-name {
      color: var(--error);
      font-weight: 600;
    }

    .error-message {
      color: var(--text);
    }

    /*
     * Footer
     */
    .footer {
      margin-top: 22px;

      color: #7392ac;

      font-size: 12px;

      letter-spacing: 0.3px;
    }

    /*
     * Floating animation
     */
    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /*
     * Mobile
     */
    @media (max-width: 500px) {
      body {
        padding: 30px 16px;
      }

      .browser {
        width: min(320px, 90vw);
        height: 210px;

        margin-bottom: 34px;
      }

      .eye:first-child {
        left: 28%;
      }

      .eye:nth-child(2) {
        right: 28%;
      }

      .mouth {
        transform: translateX(-50%) scale(0.85);
      }

      .traceback {
        padding: 15px;

        font-size: 12px;
      }
    }

    /*
     * Respect reduced-motion preferences
     */
    @media (prefers-reduced-motion: reduce) {
      .browser {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="browser">

      <div class="controls">
        <i></i>
        <i></i>
        <i></i>
      </div>

      <div class="face">

        <div class="eye"></div>
        <div class="eye"></div>

        <div class="mouth">
          <div class="lips"></div>
          <div class="lips"></div>
          <div class="lips"></div>
          <div class="lips"></div>
          <div class="lips"></div>
          <div class="lips"></div>
          <div class="lips"></div>
          <div class="lips"></div>
        </div>

      </div>
    </div>

    <h1>Something went wrong.</h1>

    <p class="subtitle">
      Alpharius encountered an unexpected error while processing your request.
    </p>

    <div class="error-card">

      <div class="error-header">
        <span class="error-dot"></span>
        <span>error.log</span>
      </div>

      <pre class="traceback"><span class="error-name">{{ error_name }}</span>: <span class="error-message">{{ error_message }}</span>

{{ traceback }}</pre>

    </div>

    <div class="footer">
      Alpharius · Quantitative Trading
    </div>

  </main>

</body>
</html>
